<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贪吃蛇</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a12;
      color: #4ade80;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    h1 {
      font-size: 32px;
      letter-spacing: 12px;
      font-weight: bold;
    }

    #score {
      font-size: 20px;
    }

    canvas {
      border: 3px solid #4ade80;
      background: #0f0f1a;
      display: block;
    }

    #buttons {
      display: flex;
      gap: 16px;
    }

    button {
      font-family: 'Courier New', Courier, monospace;
      font-size: 16px;
      font-weight: bold;
      padding: 10px 28px;
      cursor: pointer;
      border: none;
      letter-spacing: 4px;
    }

    #btnStart {
      background: #4ade80;
      color: #0f0f1a;
    }

    #btnStart:hover {
      background: #6ee7a0;
    }

    #btnRestart {
      background: transparent;
      color: #4ade80;
      border: 2px solid #4ade80;
    }

    #btnRestart:hover {
      background: rgba(74, 222, 128, 0.1);
    }
  </style>
</head>
<body>

  <div id="container">
    <h1>贪 吃 蛇</h1>
    <div id="score">得分: <span id="scoreValue">0</span></div>
    <canvas id="gameCanvas" width="500" height="500"></canvas>
    <div id="buttons">
      <button id="btnStart">开 始</button>
      <button id="btnRestart">重新开始</button>
    </div>
  </div>

  <script>
    // 游戏代码将在此处逐步添加
  </script>

</body>
</html>

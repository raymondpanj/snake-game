<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贪吃蛇</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a12;
      color: #4ade80;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    h1 {
      font-size: 32px;
      letter-spacing: 12px;
      font-weight: bold;
    }

    #score {
      font-size: 20px;
    }

    canvas {
      border: 3px solid #4ade80;
      background: #0f0f1a;
      display: block;
    }

    #buttons {
      display: flex;
      gap: 16px;
    }

    button {
      font-family: 'Courier New', Courier, monospace;
      font-size: 16px;
      font-weight: bold;
      padding: 10px 28px;
      cursor: pointer;
      border: none;
      letter-spacing: 4px;
    }

    #btnStart {
      background: #4ade80;
      color: #0f0f1a;
    }

    #btnStart:hover {
      background: #6ee7a0;
    }

    #btnRestart {
      background: transparent;
      color: #4ade80;
      border: 2px solid #4ade80;
    }

    #btnRestart:hover {
      background: rgba(74, 222, 128, 0.1);
    }
  </style>
</head>
<body>

  <div id="container">
    <h1>贪 吃 蛇</h1>
    <div id="score">得分: <span id="scoreValue">0</span></div>
    <canvas id="gameCanvas" width="500" height="500"></canvas>
    <div id="buttons">
      <button id="btnStart">开 始</button>
      <button id="btnRestart">重新开始</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreSpan = document.getElementById('scoreValue');
    const btnStart = document.getElementById('btnStart');
    const btnRestart = document.getElementById('btnRestart');

    const GRID_SIZE = 20;
    const CELL_SIZE = 25;
    const SPEED = 150;

    let snake, food, direction, nextDirection, gameState, score, gameLoopId;

    function initGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      food = { x: 15, y: 10 };
      score = 0;
      gameState = 'idle';
      scoreSpan.textContent = '0';
      btnRestart.style.display = 'none';
      draw();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 绘制网格线
      ctx.strokeStyle = 'rgba(74, 222, 128, 0.06)';
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= GRID_SIZE; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL_SIZE, 0);
        ctx.lineTo(i * CELL_SIZE, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * CELL_SIZE);
        ctx.lineTo(canvas.width, i * CELL_SIZE);
        ctx.stroke();
      }

      // 绘制蛇身
      snake.forEach((seg, i) => {
        ctx.fillStyle = i === 0 ? '#6ee7a0' : '#4ade80';
        ctx.fillRect(seg.x * CELL_SIZE + 1, seg.y * CELL_SIZE + 1, CELL_SIZE - 2, CELL_SIZE - 2);
      });

      // 绘制食物
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(food.x * CELL_SIZE + 1, food.y * CELL_SIZE + 1, CELL_SIZE - 2, CELL_SIZE - 2);
    }

    function move() {
      direction = { ...nextDirection };

      const head = snake[0];
      const newHead = { x: head.x + direction.x, y: head.y + direction.y };

      if (newHead.x < 0 || newHead.x >= GRID_SIZE || newHead.y < 0 || newHead.y >= GRID_SIZE) {
        return gameOver();
      }

      const willEat = newHead.x === food.x && newHead.y === food.y;
      const checkSegments = willEat ? snake : snake.slice(0, -1);
      if (checkSegments.some(seg => seg.x === newHead.x && seg.y === newHead.y)) {
        return gameOver();
      }

      snake.unshift(newHead);

      if (willEat) {
        score++;
        scoreSpan.textContent = score;
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function spawnFood() {
      // Will be implemented in Task 5
    }

    function gameOver() {
      // Will be implemented in Task 5
    }

    function gameLoop() {
      if (gameState === 'playing') {
        move();
      }
    }

    function startGameLoop() {
      if (gameLoopId) clearInterval(gameLoopId);
      gameLoopId = setInterval(gameLoop, SPEED);
    }

    initGame();
  </script>

</body>
</html>
